[package]
name = "memoles-world"
version = "0.1.3"
description = "Memole's World"
edition = "2021"
rust-version = "1.90"

[lib]
name = "memoles_world_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
